<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Petualangan Laut Pokémon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2fa6e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laut Pokémon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: satu layar penuh yang menghindari poni/Dynamic Island, garis home, dan sisi layar saat HP miring.
   Bilah atas tipis, baris narator + maskot, lalu panggung permainan mengisi sisa layar. */
:root{
  --sea-top:#8be3ff; --sea-mid:#2fa6e0; --sea-deep:#0b5e9c;
  --sand:#ffd98a; --sand-dark:#e8b65a;
  --coral:#ff6f61; --sun:#ffcf33; --leaf:#34c27a; --grape:#8a5cf6;
  --ink:#0d3557; --paper:#ffffff; --foam:#e9f9ff;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --r:22px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sea-top) 0%,var(--sea-mid) 55%,var(--sea-deep) 100%) fixed;
  background-color:var(--sea-mid);
  color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
img{max-width:100%;-webkit-user-drag:none}

#app{height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));
  padding-top:max(10px,calc(var(--st) + 4px));padding-bottom:max(10px,var(--sb))}

/* sinar matahari & gelembung hias */
.rays{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.rays i{position:absolute;top:-20%;width:14vw;height:140%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);transform:rotate(18deg);animation:sway 9s ease-in-out infinite alternate}
.rays i:nth-child(2){left:30%;animation-delay:-3s;width:8vw}
.rays i:nth-child(3){left:62%;animation-delay:-6s;width:11vw}
.rays i:nth-child(4){left:85%;width:6vw}
@keyframes sway{to{transform:rotate(8deg) translateX(4vw)}}
.deco-bub{position:fixed;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.08) 60%);pointer-events:none;animation:rise linear infinite;z-index:0}
@keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}

/* bilah atas */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;flex:none}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,4.2vw,32px);margin:0;color:var(--paper);text-shadow:0 3px 0 var(--sea-deep);line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 10px;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 4px 0 rgba(13,53,87,.25);min-height:48px;font-variant-numeric:tabular-nums}
.ibtn{width:52px;height:52px;border-radius:50%;background:var(--paper);font-size:26px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(13,53,87,.25);flex:none;transition:transform .12s}
.ibtn:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(13,53,87,.25)}
.star-chip{color:#b07800}
.star-chip.bump{animation:bump .45s}
@media (max-width:380px){.ibtn{width:46px;height:46px;font-size:22px}.chip{font-size:19px;min-height:44px}.top{gap:7px}}

/* panggung */
.stage{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column}
.sayrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px;flex:none;min-height:58px}
.mascot{flex:none;position:relative}
.lvb{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--grape);color:var(--paper);border-radius:999px;font-family:var(--display);font-weight:800;font-size:12px;padding:1px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mascot .pic{--s:clamp(52px,9vmin,78px)}
.mascot.talking .bod{animation:talk .35s ease-in-out infinite alternate}
.mascot.yay .bod{animation:yay .8s cubic-bezier(.3,1.5,.5,1)}
.mascot.hmm .bod{animation:hmm .7s ease-in-out}
@keyframes talk{to{transform:translateY(-4px) scale(1.03,.97)}}
@keyframes yay{0%{transform:none}25%{transform:translateY(-40%) rotate(-14deg) scale(1.1)}50%{transform:translateY(0) scale(1.15,.85)}70%{transform:translateY(-14%) rotate(10deg)}100%{transform:none}}
@keyframes hmm{20%{transform:rotate(-14deg)}45%{transform:rotate(12deg)}70%{transform:rotate(-6deg)}}
.say{position:relative;background:var(--paper);border-radius:22px;padding:8px 18px;font-family:var(--display);font-weight:800;font-size:clamp(17px,3.4vw,27px);line-height:1.15;box-shadow:0 4px 0 rgba(13,53,87,.2);max-width:min(100%,760px);text-wrap:balance;min-width:0}
.say::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--paper);border-left:0}
.say.talk{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.say:empty{visibility:hidden}

/* beranda */
.home{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.hello{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--paper);text-align:center}
.hello .pic{--s:clamp(70px,15vmin,124px)}
.hello p{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,30px);margin:0;text-shadow:0 2px 0 var(--sea-deep);line-height:1.15;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:1100px;margin:0 auto}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;background:var(--paper);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 var(--c,var(--coral));border:4px solid var(--c,var(--coral));transition:transform .12s;min-height:150px;justify-content:center;overflow:hidden}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--c)}
.tile .pic{--s:clamp(54px,12vmin,88px)}
.tile .big{position:absolute;top:6px;right:8px;font-size:26px;line-height:1}
.tile b{font-family:var(--display);font-weight:800;font-size:clamp(18px,3.4vw,25px);line-height:1.05;text-align:center}
.tile small{font-weight:700;font-size:14px;opacity:.7;text-align:center;line-height:1.2}
.tile.dexy{background:linear-gradient(160deg,#fff 40%,#fff3c4)}
.parent{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pbtn{background:var(--paper);border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--sea-deep);min-height:48px}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sea-deep)}
.foot{font-size:13px;color:var(--paper);opacity:.92;text-align:center;max-width:65ch;margin:0 auto;font-weight:700;line-height:1.4}

/* karakter Pokémon: .pic > .bod > img. Gerakan idle di .bod, aksi (lompat, putar) lewat Web Animations */
.pic{--s:96px;width:var(--s);height:var(--s);min-width:0;min-height:0;max-width:100%;position:relative;flex:none;display:block;z-index:0}
.bod{position:absolute;inset:0;transform-origin:50% 88%}
.pic img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.16));pointer-events:none}
.pic img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.pic .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s) * .72);line-height:1;pointer-events:none}
/* teks selalu di atas gambar Pokémon */
.opt b,.tile b,.tile small,.dexc b,.dexc small,.party h2,.party p,.lvb,.cnt .tag{position:relative;z-index:2}
.opt,.tile,.dexc,.cnt,.card,.hole{isolation:isolate}
.live .bod{animation:breathe 2.4s ease-in-out infinite}
.still .bod{animation:idle 2.2s ease-in-out infinite}
.calm .bod{animation:none}
@keyframes breathe{50%{transform:scale(1.035,.965)}}
@keyframes idle{0%,100%{transform:none}20%{transform:translateY(-7%) rotate(-4deg) scale(.97,1.04)}40%{transform:translateY(0) scale(1.05,.95)}60%{transform:rotate(3deg)}80%{transform:translateY(-3%) rotate(-1deg)}}
.shadow .pic img,.shadow .pic .emo{filter:brightness(0) opacity(.85)}

@keyframes bump{50%{transform:scale(1.25)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
@keyframes popin{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
@keyframes enter{0%{transform:translateX(30%) scale(.85);opacity:0}70%{transform:translateX(-3%) scale(1.02);opacity:1}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-2deg)}40%,80%{transform:translateX(10px) rotate(2deg)}}
.popin{animation:popin .55s cubic-bezier(.2,1.4,.4,1) both}
.enter{animation:enter .55s cubic-bezier(.2,1.2,.4,1) both}
.nope{animation:shake .45s}
.catchfly{z-index:45}
.newtag{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--coral);color:var(--paper);font-family:var(--display);font-weight:800;font-size:14px;border-radius:999px;padding:1px 8px;white-space:nowrap}
#dexBtn.bump2{animation:bump .5s 2}
.opts.ord{flex-wrap:nowrap;gap:clamp(4px,1.6vw,16px);align-items:center;max-width:100%}
.ord .opt{padding:6px;min-width:0}
.ord .pic,.ordb .pic,.hole2 span{--s:clamp(46px,min(17vw,15vh),116px)}
.hole2 span{display:grid;place-items:center;width:var(--s);height:var(--s);font-family:var(--display);font-weight:800;font-size:36px;opacity:.35}
.ord .arrow{font-size:clamp(20px,5vw,34px);color:var(--paper);flex:none}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:40;font-size:28px;line-height:1;will-change:transform}

/* tombol jawaban */
.opts{display:flex;justify-content:center;gap:clamp(10px,3vw,24px);flex-wrap:wrap}
.opt{background:var(--paper);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 var(--sea-deep);border:4px solid transparent;transition:transform .12s,opacity .25s}
.opt:active{transform:translateY(4px)}
.opt b{font-family:var(--display);font-weight:800;font-size:clamp(13px,2.5vw,20px);max-width:7.5em;line-height:1.05;text-align:center;overflow-wrap:anywhere;background:var(--paper);border-radius:8px;padding:0 4px}
.opt.no{opacity:.35}
.opt.yes{border-color:var(--leaf)}
.num{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vmin,72px);min-width:clamp(80px,18vmin,130px);line-height:1;padding:12px}

.q{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px}
.spot{background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 68%);border-radius:50%;padding:10px;display:grid;place-items:center}
.spot .pic{--s:min(44vmin,280px)}
.spot.show .pic img{filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.opts .pic{--s:clamp(62px,min(19vw,16vh),124px)}

/* hitung */
.count-area{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:clamp(6px,2vw,16px);width:100%}
.cnt{position:relative;background:rgba(255,255,255,.55);border-radius:50%;padding:6px;transition:background .2s}
.cnt.on{background:var(--sun)}
.cnt .tag{position:absolute;top:-6px;right:-6px;background:var(--coral);color:var(--paper);font-family:var(--display);font-weight:800;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,.2);animation:popin .4s both}
.few .pic{--s:clamp(70px,min(24vw,24vh),170px)}
.mid .pic{--s:clamp(60px,min(19vw,17vh),130px)}
.many .pic{--s:clamp(48px,min(15vw,13vh),110px)}

/* besar kecil */
.sizes{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,30px);--base:min(34vw,40vh,260px);padding-bottom:6%}
.sizes .opt{padding:8px;align-self:flex-end}

/* kartu */
.memwrap{flex:1;min-height:0;display:grid;place-items:center}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);width:min(100%,88vh)}
.card{aspect-ratio:3/4;perspective:700px;max-width:100%}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 rgba(13,53,87,.3)}
.card .b{background:repeating-linear-gradient(135deg,var(--sea-mid) 0 12px,#45b8ee 12px 24px);border:4px solid var(--paper)}
.card .b::after{content:"";width:42%;aspect-ratio:1;border-radius:50%;background:linear-gradient(var(--coral) 0 46%,var(--ink) 46% 54%,var(--paper) 54%);border:3px solid var(--ink)}
.card .f{background:var(--paper);transform:rotateY(180deg);border:4px solid var(--sun)}
.card .f .pic{--s:80%}
.card.done .f{border-color:var(--leaf)}
@media (max-aspect-ratio:3/4){.mem{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,60vh)}}

/* gelembung */
.pond{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--r);touch-action:none}
.target{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.18em;border:3px solid var(--ink);margin-left:6px}
.bb{position:absolute;left:0;top:0;border-radius:50%;width:var(--d);height:var(--d);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 10%,var(--c) 38%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:inset 0 -6px 12px rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.6);will-change:transform}
.bb.popd{animation:popa .3s forwards;pointer-events:none}
@keyframes popa{to{opacity:0;scale:1.8}}
.floaty{position:absolute;left:0;top:0;pointer-events:none}

/* arena bergerak (renang, lari, mancing) */
.arena{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--r);touch-action:none}
.sea{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(11,94,156,.35));cursor:crosshair}
.sandbed{position:absolute;left:0;right:0;bottom:0;height:12%;background:radial-gradient(ellipse at 20% 0,var(--sand) 60%,transparent 61%),radial-gradient(ellipse at 75% 10%,var(--sand) 55%,transparent 56%),linear-gradient(transparent 40%,var(--sand) 40%)}
.weed{position:absolute;bottom:6%;width:28px;height:30%;background:var(--leaf);border-radius:50% 50% 8px 8px / 90% 90% 8px 8px;transform-origin:bottom;animation:weed 3s ease-in-out infinite alternate}
.weed.w1{left:8%}.weed.w2{left:14%;height:20%;animation-delay:-1s;background:#2aa866}.weed.w3{right:10%;height:26%;animation-delay:-2s}
@keyframes weed{to{transform:rotate(9deg)}}
.slots{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:2px;z-index:3;pointer-events:none;font-size:clamp(18px,4vw,30px)}
.slot{filter:grayscale(1) opacity(.35);transition:filter .3s}
.slot.got{filter:none;animation:bump .4s}
.sprite{position:absolute;left:0;top:0;will-change:transform}
.hero{z-index:2}
.flip{transform:scaleX(-1)}
.starb{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 55%);border:3px solid rgba(255,255,255,.85);animation:spinst 3s linear infinite}
@keyframes spinst{50%{filter:brightness(1.25)}}
.trail{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.8);pointer-events:none;animation:trail 1.2s ease-out forwards}
@keyframes trail{to{transform:translateY(-60px);opacity:0}}
.hurt{animation:blink .15s steps(2) 6}
@keyframes blink{50%{opacity:.25}}

/* lari dino */
.land{background:linear-gradient(180deg,#9fe7ff 0%,#d8f6ff 55%,#ffe6a8 80%);cursor:pointer}
.ground{position:absolute;left:0;right:0;bottom:0;height:20%;background:repeating-linear-gradient(90deg,#d79a4e 0 40px,#c98a40 40px 80px);background-size:80px 100%;border-top:8px solid #6cc04a}
.far{position:absolute;bottom:19%;font-size:var(--fs,60px);line-height:1;pointer-events:none}
.cloud{position:absolute;font-size:46px;opacity:.9;pointer-events:none}
.rock{position:absolute;left:0;top:0;line-height:1;pointer-events:none}

/* mancing */
.fishy{background:linear-gradient(180deg,#bdf0ff 0 34%,#3fb3e8 34%,#1676b8 100%)}
.wavetop{position:absolute;left:-10%;right:-10%;top:calc(34% - 12px);height:24px;background:radial-gradient(circle at 12px 0,transparent 12px,#3fb3e8 13px) 0 0/24px 24px repeat-x;animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(24px)}}
.dock{position:absolute;left:0;width:36%;height:18px;top:calc(34% - 16px);background:repeating-linear-gradient(90deg,#9a6a3a 0 22px,#7d522a 22px 26px);border-radius:0 6px 6px 0;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.bobber{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:linear-gradient(var(--coral) 0 50%,#fff 50%);border:3px solid var(--ink);z-index:3}
.excl{position:absolute;left:50%;bottom:120%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:44px;color:var(--coral);text-shadow:0 2px 0 #fff;animation:bump .4s infinite}
.ring{position:absolute;border:3px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;animation:ring .9s ease-out forwards}
@keyframes ring{from{width:10px;height:6px;margin:-3px 0 0 -5px;opacity:1}to{width:120px;height:40px;margin:-20px 0 0 -60px;opacity:0}}
.shfish{position:absolute;font-size:40px;filter:brightness(0) opacity(.18);pointer-events:none;animation:shswim linear infinite}
@keyframes shswim{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* ciluk ba */
.peek{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,18px);align-content:center;width:min(100%,100vh);margin:0 auto}
.hole{position:relative;aspect-ratio:1;overflow:hidden;border-radius:50% 50% 18px 18px}
.peeker{position:absolute;left:10%;right:10%;bottom:14%;height:76%;transform:translateY(115%);transition:transform .38s cubic-bezier(.3,1.6,.5,1);display:grid;place-items:center;touch-action:none}
.peeker.up{transform:translateY(0)}
.peeker .pic{--s:100%;width:100%;height:100%}
.wave2{position:absolute;left:0;right:0;bottom:0;height:30%;background:radial-gradient(circle at 16px 0,transparent 16px,#2fa6e0 17px) 0 0/32px 100% repeat-x,linear-gradient(transparent 35%,#2fa6e0 35%);pointer-events:none}
.hole::before{content:"";position:absolute;left:4%;right:4%;bottom:8%;height:26%;border-radius:50%;background:rgba(11,94,156,.45)}

/* puzzle */
.pz{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px}
@media (min-aspect-ratio:5/4){.pz{flex-direction:row}}
.board{--n:2;position:relative;width:min(80vw,42vh,420px);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);background:rgba(255,255,255,.35);border-radius:16px;box-shadow:0 6px 0 var(--sea-deep);flex:none}
@media (min-aspect-ratio:5/4){.board{width:min(46vw,64vh,460px)}}
.board .ghost{position:absolute;inset:0;background-size:100% 100%;opacity:.18;filter:grayscale(1);pointer-events:none}
.slotp{border:2px dashed rgba(255,255,255,.85);position:relative}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:min(100%,520px)}
.piece{width:var(--ps);height:var(--ps);border-radius:10px;box-shadow:0 4px 0 rgba(13,53,87,.35);touch-action:none;cursor:grab;transform:rotate(var(--rot,0deg));transition:transform .2s}
.piece.drag{position:fixed;z-index:30;transform:scale(1.08);transition:none;box-shadow:0 12px 20px rgba(0,0,0,.25);cursor:grabbing}
.slotp .piece{transform:none;border-radius:0;box-shadow:none;width:100%;height:100%;cursor:default}
.board.done{animation:bump .6s;box-shadow:0 6px 0 var(--leaf),0 0 0 6px var(--sun)}

/* evolusi */
.feed{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:8px}
.hearts{font-size:clamp(26px,6vw,40px);letter-spacing:4px}
.hearts span{display:inline-block;transition:transform .3s}
.hearts span.on{animation:bump .5s}
.pet{position:relative;display:grid;place-items:center}
.pet .pic{--s:min(46vmin,290px)}
.pet .pic+.pic{position:absolute;left:0;top:0}
.pet.evo .pic img{filter:brightness(0) invert(1) drop-shadow(0 0 18px #fff) drop-shadow(0 0 30px #8be3ff)}
.berries{display:flex;gap:clamp(8px,2vw,16px);flex-wrap:wrap;justify-content:center}
.berry{font-size:clamp(40px,9vmin,64px);width:clamp(64px,14vmin,96px);height:clamp(64px,14vmin,96px);border-radius:50%;background:var(--paper);box-shadow:0 5px 0 var(--sea-deep);display:grid;place-items:center;line-height:1}
.berry:active{transform:translateY(4px)}
.flash{position:fixed;inset:0;background:#fff;z-index:35;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* telur */
.eggwrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.egg{position:relative;width:min(44vmin,250px);aspect-ratio:.78;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 30% 34%,var(--c2) 0 7%,transparent 7.5%),radial-gradient(circle at 70% 55%,var(--c2) 0 10%,transparent 10.5%),radial-gradient(circle at 42% 76%,var(--c2) 0 7%,transparent 7.5%),radial-gradient(circle at 64% 22%,var(--c2) 0 5%,transparent 5.5%),radial-gradient(circle at 35% 28%,#fff,var(--c1) 72%);box-shadow:inset -10px -14px 0 rgba(0,0,0,.08),0 10px 0 rgba(13,53,87,.25);animation:eggidle 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes eggidle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(3deg)}30%{transform:rotate(0)}}
.egg svg{position:absolute;inset:0;width:100%;height:100%}
.egg path{fill:none;stroke:#5a3b1a;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.egg path.on{opacity:1}
.nest{width:min(56vmin,320px);height:34px;margin-top:-30px;border-radius:50%;background:repeating-linear-gradient(60deg,#c8914d 0 8px,#a8733a 8px 16px);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.baby .pic{--s:min(46vmin,260px)}

/* fosil */
.digwrap{flex:1;min-height:0;display:grid;place-items:center}
.dig{position:relative;width:min(100%,56vh,520px);aspect-ratio:1;border-radius:28px;overflow:hidden;background:radial-gradient(circle,#f3e2bf,#c99c5c);box-shadow:0 8px 0 var(--sand-dark),inset 0 0 0 6px rgba(255,255,255,.4);touch-action:none}
.dig .pic{--s:78%;position:absolute;inset:11%;width:78%;height:78%}
.dig .stone img{filter:grayscale(1) sepia(.9) brightness(.75) contrast(1.2)}
.dig canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s;cursor:grab}
.dig.alive canvas{opacity:0;pointer-events:none}
.hand{position:absolute;font-size:56px;left:40%;top:45%;pointer-events:none;animation:rub 1.4s ease-in-out infinite;z-index:3}
@keyframes rub{50%{transform:translate(50px,20px) rotate(-12deg)}}

/* koleksi */
.dexwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.regions{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;flex:none;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.reg{flex:none;background:rgba(255,255,255,.6);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(13,53,87,.25);white-space:nowrap;font-variant-numeric:tabular-nums}
.reg.on{background:var(--sun)}
.dex{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;padding-bottom:10px}
.dexc{background:var(--paper);border-radius:18px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 rgba(13,53,87,.25);content-visibility:auto;contain-intrinsic-size:auto 128px}
.dexc .pic{--s:72px}
.dexc b{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.dexc small{font-size:11px;font-weight:800;opacity:.55;font-variant-numeric:tabular-nums}
.dexc.lock{background:rgba(255,255,255,.45)}
.dexc.lock .pic img{filter:brightness(0) opacity(.3)}
.dexc.buddy{outline:4px solid var(--sun)}

/* jendela (rayakan, detail, pengaturan) */
.party{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(11,94,156,.55);
  padding:max(20px,calc(var(--st) + 10px)) max(16px,var(--sr)) max(20px,calc(var(--sb) + 10px)) max(16px,var(--sl));overflow-y:auto}
.party .box{background:var(--paper);border-radius:32px;padding:22px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 0 var(--sun);max-width:460px;width:100%;animation:popin .55s cubic-bezier(.2,1.4,.4,1) both}
.party h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,50px);margin:0;line-height:1;color:var(--coral)}
.party p{margin:0;font-weight:800;font-size:19px;text-wrap:balance}
.party .pic{--s:clamp(110px,28vmin,180px)}
.party .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigbtn{font-family:var(--display);font-weight:800;font-size:23px;border-radius:999px;padding:12px 26px;background:var(--leaf);color:var(--paper);box-shadow:0 5px 0 #1f8a54;min-height:60px}
.bigbtn.alt{background:var(--sea-mid);box-shadow:0 5px 0 var(--sea-deep)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #1f8a54}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tagrow span{background:var(--foam);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.guide{text-align:left;margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:17px;line-height:1.35}
.guide b{font-weight:900}
.box.help{gap:14px}
.box.help h2{font-size:clamp(26px,6vw,36px);color:var(--sea-deep)}
.box.help p{font-size:15px;font-weight:700;opacity:.8}
.field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;font-weight:900}
.field select,.field input{font:inherit;font-weight:700;padding:10px;border-radius:12px;border:2px solid #b9dcef;background:var(--foam);color:var(--ink);width:100%}
.conf{position:fixed;top:-60px;font-size:34px;z-index:21;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

.toast{width:max-content;white-space:nowrap;position:fixed;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);z-index:25;background:var(--paper);border-radius:999px;padding:6px 22px 6px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 0 var(--sun);font-family:var(--display);font-weight:800;font-size:19px;animation:toast 3s forwards;max-width:calc(100% - 32px);pointer-events:none}
.toast .pic{--s:60px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,40px) scale(.8)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,20px)}}

@media (prefers-reduced-motion:reduce){
  .rays i,.deco-bub,.weed,.live .bod,.still .bod,.hand,.egg,.wavetop,.shfish,.starb{animation:none!important}
  .card .in{transition:none}
}
</style>
</head>
<body>
<div class="rays" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app">
  <header class="top">
    <button class="ibtn" id="homeBtn" aria-label="Kembali ke beranda" hidden>🏠</button>
    <h1 id="ttl">Petualangan Laut</h1>
    <button class="chip star-chip" id="stars" aria-label="Bintang">⭐ <span id="starN">0</span></button>
    <button class="ibtn" id="dexBtn" aria-label="Koleksi Pokémon">📖</button>
    <button class="ibtn" id="sndBtn" aria-label="Suara">🔊</button>
  </header>
  <main class="stage" id="stage"></main>
</div>
<script src="dex.js"></script>
<script src="game.js"></script>
</body>
</html>
